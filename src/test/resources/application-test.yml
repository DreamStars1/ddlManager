# 测试环境配置
# 用于单元测试和集成测试

spring:
  application:
    name: ddl-manager-test

  # 测试环境使用 H2 内存数据库，避免依赖真实 MySQL
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # Redis 配置 - 测试环境可以禁用或使用嵌入式 Redis
  # 如果测试不需要 Redis，可以注释掉
  redis:
    host: localhost
    port: 6379
    database: 15 # 使用不同的数据库编号，避免影响开发数据
    timeout: 1000
    lettuce:
      pool:
        max-active: 5
        max-wait: -1
        max-idle: 2
        min-idle: 0

  # 邮件配置 - 测试环境可以使用测试邮箱或禁用
  mail:
    host: smtp.qq.com
    port: 587
    username: no-answer-ddlTest@foxmail.com
    password: mpembwpbtqhhihdf
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Kafka 配置 - 测试环境
  kafka:
    enabled: true
    consumer:
      servers: localhost:9092
      enable-auto-commit: true
      session-timeout: 6000
      auto-commit-interval: 100
      auto-offset-reset: earliest # 测试环境使用 earliest，确保能消费到所有消息
      group-id: ddl-reminder-group-test
      concurrency: 1
    producer:
      servers: localhost:9092
      retries: 0
      batch-size: 4096
      linger: 1
      buffer-memory: 40960

# 日志配置
logging:
  level:
    root: WARN
    com.ddl.manager: DEBUG
    org.springframework: WARN
    org.hibernate: WARN

# DDL系统自定义配置
ddl:
  reminder:
    default-hours: 24
    topic: ddl-reminder-test
  dashboard:
    upcoming-days: 7
