spring:
  datasource:
    url: jdbc:mysql://localhost:13306/ddl_manager?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    host: localhost
    port: 6380
    database: 0
    timeout: 1800000
    lettuce:
      pool:
        max-active: 20
        max-wait: -1
        max-idle: 5
        min-idle: 0

# Kafka配置（Docker Kafka）
kafka:
  enabled: true # 启用 Kafka
  consumer:
    servers: localhost:9092
    enable-auto-commit: true
    session-timeout: 6000
    auto-commit-interval: 100
    auto-offset-reset: latest
    group-id: ddl-reminder-group
    concurrency: 1 # 降低并发数，避免创建过多Consumer实例
  producer:
    servers: localhost:9092
    retries: 0
    batch-size: 4096
    linger: 1
    buffer-memory: 40960
