# 本地服务配置（使用本地安装的 MySQL、Redis 等）
# 激活方式: --spring.profiles.active=local 或设置环境变量 SPRING_PROFILES_ACTIVE=local

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ddl_manager?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 1800000
    lettuce:
      pool:
        max-active: 20
        max-wait: -1
        max-idle: 5
        min-idle: 0

# Kafka配置（本地 Kafka）
kafka:
  enabled: true  # 启用 Kafka
  consumer:
    servers: localhost:9092
    enable-auto-commit: true
    session-timeout: 6000
    auto-commit-interval: 100
    auto-offset-reset: latest
    group-id: ddl-reminder-group
    concurrency: 10
  producer:
    servers: localhost:9092
    retries: 0
    batch-size: 4096
    linger: 1
    buffer-memory: 40960


