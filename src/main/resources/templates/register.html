<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>注册 - DDL管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.9;
        }
        .error {
            color: #e74c3c;
            text-align: center;
            margin-bottom: 15px;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
        }
        .login-link a {
            color: #667eea;
            text-decoration: none;
        }

        .avatar-upload {
            margin-bottom: 15px;
        }

        .avatar-upload > input[type="file"] {
            /* 自定义文件选择框样式，更美观 */
            padding: 10px 15px;
            border: 1px dashed #e2e8f0; /* 虚线边框，区分普通输入框 */
            background-color: #f7fafc;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .avatar-upload > input[type="file"]:hover {
            border-color: #667eea;
            background-color: #f0f4ff;
        }

        .avatar-preview-label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-size: 14px;
            font-weight: 500;
        }

        .avatar-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto; /* 水平居中，更规整 */
            display: block; /* 块级元素，便于居中 */
            object-fit: cover;
            border: 3px solid #f7fafc; /* 边框装饰，更精致 */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); /* 轻微阴影，提升立体感 */
        }
    </style>
</head>
<body>
<div class="register-container">
    <h1>用户注册</h1>
    <div
            th:if="${errorMessage}"
            class="error"
            th:text="${errorMessage}"
    ></div>
    <div
            th:if="${successMessage}"
            class="success"
            th:text="${successMessage}"
            style="color: #27ae60; text-align: center; margin-bottom: 15px"
    ></div>
    <form th:action="@{/register}" method="post" th:object="${registerDTO}" enctype="multipart/form-data" id="registerForm">
        <div class="form-group">
            <label for="username">用户名</label>
            <input
                    type="text"
                    id="username"
                    th:field="*{username}"
                    required
                    placeholder="请输入用户名（3-50个字符）"
            />
            <div
                    th:if="${#fields.hasErrors('username')}"
                    th:errors="*{username}"
                    style="color: #e74c3c; font-size: 12px; margin-top: 5px"
            ></div>
        </div>
        <div class="form-group">
            <label for="email">邮箱</label>
            <input
                    type="email"
                    id="email"
                    th:field="*{email}"
                    required
                    placeholder="请输入邮箱"
            />
            <div
                    th:if="${#fields.hasErrors('email')}"
                    th:errors="*{email}"
                    style="color: #e74c3c; font-size: 12px; margin-top: 5px"
            ></div>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input
                    type="password"
                    id="password"
                    th:field="*{password}"
                    required
                    placeholder="请输入密码（至少6个字符）"
            />
            <div
                    th:if="${#fields.hasErrors('password')}"
                    th:errors="*{password}"
                    style="color: #e74c3c; font-size: 12px; margin-top: 5px"
            ></div>
        </div>
        <div class="form-group">
            <label for="confirmPassword">确认密码</label>
            <input
                    type="password"
                    id="confirmPassword"
                    th:field="*{confirmPassword}"
                    required
                    placeholder="请再次输入密码"
            />
        </div>
        <div class="form-group avatar-upload">
            <label>用户头像</label>
            <!-- 头像文件选择：隐藏原始input，使用压缩后的文件上传 -->
            <input type="file"
                   id="avatarFile"
                   accept="image/jpg,image/jpeg,image/png,image/gif"
                   onchange="handleAvatarSelect(this)">
            <!-- 原始头像字段（隐藏，用于存放压缩后的文件） -->
            <input type="file"
                   th:field="*{avatar}"
                   id="compressedAvatar"
                   style="display: none;">
            <!-- 头像预览 -->
            <label class="avatar-preview-label">头像预览（自动压缩至500KB以内）</label>
            <img id="avatarPreview"
                 class="avatar-preview"
                 th:src="@{/images/0.jpg}">
        </div>
        <button type="submit">注册</button>
    </form>
    <div class="login-link">
        已有账号？<a th:href="@{/login}">立即登录</a>
    </div>
</div>
<script th:inline="javascript">
    // 1. 头像选择与强制压缩处理（确保最终≤500KB）
    function handleAvatarSelect(input) {
        if (!input.files || !input.files[0]) {
            // 重置预览和压缩文件
            const defaultAvatarUrl = /*[[@{/images/default-avatar.png}]]*/ '';
            document.getElementById('avatarPreview').src = defaultAvatarUrl || '/images/default-avatar.png';
            document.getElementById('compressedAvatar').value = '';
            return;
        }

        const file = input.files[0];
        const targetMaxSize = 500 * 1024; // 目标最大尺寸：500KB
        // 直接对文件进行强制压缩（即使小于500KB，也可轻微压缩优化体积；若大于则循环压缩至达标）
        compressImageToTargetSize(file, targetMaxSize, function(compressedFile) {
            // 压缩完成后预览并设置到表单
            previewAndSetFile(compressedFile);
        });
    }

    // 2. 核心：循环压缩图片，确保最终体积≤目标尺寸
    function compressImageToTargetSize(file, targetSize, callback) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                let width = img.width;
                let height = img.height;
                let quality = 0.8; // 初始压缩质量
                const minQuality = 0.1; // 最低压缩质量（避免图片过度模糊）
                const stepQuality = 0.1; // 每次质量下调步长
                let canvas = document.createElement('canvas');
                let ctx = canvas.getContext('2d');

                // 循环压缩：直到文件体积≤目标尺寸 或 质量已达最低值
                function loopCompress() {
                    // 第一步：按比例缩小尺寸（先减小像素总量，快速降低体积）
                    // 先限制最大宽高，再根据当前质量进一步压缩
                    const maxWH = 600; // 初始最大宽高（比800更小，更快压缩到目标体积）
                    if (width > maxWH || height > maxWH) {
                        const ratio = Math.min(maxWH / width, maxWH / height);
                        width *= ratio;
                        height *= ratio;
                    }

                    // 更新canvas尺寸
                    canvas.width = Math.floor(width);
                    canvas.height = Math.floor(height);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    // 将canvas转为Blob，判断体积是否达标
                    canvas.toBlob(function(blob) {
                        // 检查当前Blob体积是否符合要求
                        if (blob.size <= targetSize || quality <= minQuality) {
                            // 达标或质量已最低，创建压缩后的文件并回调
                            const compressedFile = new File([blob], file.name, {
                                type: file.type,
                                lastModified: Date.now()
                            });
                            callback(compressedFile);
                            return;
                        }

                        // 未达标：降低质量，继续循环压缩
                        quality -= stepQuality;
                        // 额外优化：若质量低于0.3，进一步缩小尺寸（双重压缩）
                        if (quality < 0.3) {
                            width *= 0.8;
                            height *= 0.8;
                        }
                        loopCompress();
                    }, file.type, quality);
                }

                // 启动循环压缩
                loopCompress();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // 2. 预览图片并设置压缩后的文件到表单
    function previewAndSetFile(file) {
        // 预览图片
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('avatarPreview').src = e.target.result;
        }
        reader.readAsDataURL(file);

        // 将压缩后的文件设置到隐藏的input（供表单提交）
        const dataTransfer = new DataTransfer();
        dataTransfer.items.add(file);
        document.getElementById('compressedAvatar').files = dataTransfer.files;
    }
</script>
</body>
</html>
