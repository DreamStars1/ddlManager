server:
  port: 8080 # 使用8080端口

spring:
  application:
    name: ddl-manager

  # 激活的配置文件: local (本地服务) 或 docker (Docker 服务)
  # 可以通过启动参数覆盖: --spring.profiles.active=docker
  # 或设置环境变量: SPRING_PROFILES_ACTIVE=docker
  profiles:
    active: docker # 默认使用 Docker 配置

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  # 数据源和 Redis 配置已移至 profile 配置文件
  # application-local.yml: 本地服务配置（端口 3306, 6379）
  # application-docker.yml: Docker 服务配置（端口 13306, 6380）

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    encoding: UTF-8

  # 邮件配置
  mail:
    host: smtp.qq.com
    port: 587
    username: no-answer-ddlTest@foxmail.com
    password: mpembwpbtqhhihdf
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Kafka 配置已移至 profile 配置文件
# application-local.yml 和 application-docker.yml 中都有 Kafka 配置

# DDL系统自定义配置
ddl:
  reminder:
    default-hours: 24
    topic: ddl-reminder
  dashboard:
    upcoming-days: 7

# 日志配置
logging:
  level:
    root: INFO
    com.ddl.manager: DEBUG
    org.springframework.security: DEBUG
  file:
    name: logs/ddl-manager.log
