server:
  port: 8080

spring:
  application:
    name: ddl-manager


  datasource:
    url: jdbc:mysql://localhost:3306/ddl_manager?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true


  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 1800000
    lettuce:
      pool:
        max-active: 20
        max-wait: -1
        max-idle: 5
        min-idle: 0


  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    encoding: UTF-8

  # 邮件配置
  mail:
    host: smtp.qq.com
    port: 587
    username: your-email@qq.com
    password: your-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Kafka配置
kafka:
  consumer:
    servers: localhost:9092
    enable-auto-commit: true
    session-timeout: 6000
    auto-commit-interval: 100
    auto-offset-reset: latest
    group-id: ddl-reminder-group
    concurrency: 10
  producer:
    servers: localhost:9092
    retries: 0
    batch-size: 4096
    linger: 1
    buffer-memory: 40960



# DDL系统自定义配置
ddl:
  reminder:
    default-hours: 24
    topic: ddl-reminder
  dashboard:
    upcoming-days: 7

# 日志配置
logging:
  level:
    root: INFO
    com.ddl.manager: DEBUG
    org.springframework.security: DEBUG
  file:
    name: logs/ddl-manager.log
