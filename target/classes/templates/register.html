<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>注册 - DDL管理系统</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .register-container {
        background: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
      }
      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 30px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        color: #666;
      }
      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
      }
      input:focus {
        outline: none;
        border-color: #667eea;
      }
      button {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.9;
      }
      .error {
        color: #e74c3c;
        text-align: center;
        margin-bottom: 15px;
      }
      .login-link {
        text-align: center;
        margin-top: 20px;
      }
      .login-link a {
        color: #667eea;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="register-container">
      <h1>用户注册</h1>
      <div
        th:if="${errorMessage}"
        class="error"
        th:text="${errorMessage}"
      ></div>
      <div
        th:if="${successMessage}"
        class="success"
        th:text="${successMessage}"
        style="color: #27ae60; text-align: center; margin-bottom: 15px"
      ></div>
      <form th:action="@{/register}" method="post" th:object="${registerDTO}">
        <div class="form-group">
          <label for="username">用户名</label>
          <input
            type="text"
            id="username"
            th:field="*{username}"
            required
            placeholder="请输入用户名（3-50个字符）"
          />
          <div
            th:if="${#fields.hasErrors('username')}"
            th:errors="*{username}"
            style="color: #e74c3c; font-size: 12px; margin-top: 5px"
          ></div>
        </div>
        <div class="form-group">
          <label for="email">邮箱</label>
          <input
            type="email"
            id="email"
            th:field="*{email}"
            required
            placeholder="请输入邮箱"
          />
          <div
            th:if="${#fields.hasErrors('email')}"
            th:errors="*{email}"
            style="color: #e74c3c; font-size: 12px; margin-top: 5px"
          ></div>
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input
            type="password"
            id="password"
            th:field="*{password}"
            required
            placeholder="请输入密码（至少6个字符）"
          />
          <div
            th:if="${#fields.hasErrors('password')}"
            th:errors="*{password}"
            style="color: #e74c3c; font-size: 12px; margin-top: 5px"
          ></div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">确认密码</label>
          <input
            type="password"
            id="confirmPassword"
            th:field="*{confirmPassword}"
            required
            placeholder="请再次输入密码"
          />
          <div
            th:if="${#fields.hasErrors('confirmPassword')}"
            th:errors="*{confirmPassword}"
            style="color: #e74c3c; font-size: 12px; margin-top: 5px"
          ></div>
        </div>
        <button type="submit">注册</button>
      </form>
      <div class="login-link">
        已有账号？<a th:href="@{/login}">立即登录</a>
      </div>
    </div>
  </body>
</html>
