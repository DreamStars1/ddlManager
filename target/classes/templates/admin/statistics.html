<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>系统统计</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="container">
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-brand">DDL管理系统 - 管理员</div>
        <div class="nav-menu">
            <a th:href="@{/admin/dashboard}">仪表盘</a>
            <a th:href="@{/admin/users}">用户管理</a>
            <a th:href="@{/admin/statistics}" class="active">系统统计</a>
            <a th:href="@{/dashboard}">返回主站</a>
            <a th:href="@{/logout}">退出</a>
        </div>
    </nav>

    <!-- 内容区域 -->
    <div class="content">
        <h1>系统统计</h1>

        <div class="stats-section">
            <h3>接口调用统计</h3>
            <div id="apiStatistics">
                <p>统计功能开发中...</p>
            </div>
        </div>

        <div class="stats-section">
            <h3>Session监控</h3>
            <button onclick="loadSessionStats()" class="btn btn-info">刷新Session统计</button>
            <div id="sessionStats"></div>
        </div>
    </div>
</div>

<script>
    function loadSessionStats() {
        fetch('/api/admin/session/statistics')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('sessionStats').innerHTML = `
                            <p>在线用户: ${data.data.onlineUsers}</p>
                            <p>总Session数: ${data.data.totalSessions}</p>
                        `;
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
    }
</script>
</body>
</html>
