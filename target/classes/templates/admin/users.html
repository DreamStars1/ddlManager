<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">用户管理</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="container">
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-brand">DDL管理系统 - 管理员</div>
        <div class="nav-menu">
            <a th:href="@{/admin/dashboard}">仪表盘</a>
            <a th:href="@{/admin/users}" class="active">用户管理</a>
            <a th:href="@{/admin/statistics}">系统统计</a>
            <a th:href="@{/dashboard}">返回主站</a>
            <a th:href="@{/logout}">退出</a>
        </div>
    </nav>

    <!-- 内容区域 -->
    <div class="content">
        <h1 th:text="${pageTitle}">用户管理</h1>

        <!-- 用户列表 -->
        <div class="user-list">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>用户名</th>
                    <th>邮箱</th>
                    <th>角色</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <!-- 临时示例数据 -->
                <tr>
                    <td>1</td>
                    <td>admin</td>
                    <td>admin@test.com</td>
                    <td>管理员</td>
                    <td><span class="status-active">启用</span></td>
                    <td>
                        <button class="btn btn-warning btn-sm">禁用</button>
                    </td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>user</td>
                    <td>user@test.com</td>
                    <td>普通用户</td>
                    <td><span class="status-active">启用</span></td>
                    <td>
                        <button class="btn btn-warning btn-sm">禁用</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
