<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>API调用统计 - DDL管理系统</title>
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css}">
    <script th:src="@{https://cdn.jsdelivr.net/npm/chart.js}"></script>
    <script th:src="@{https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js}"></script>
    <style>
        .container {
            margin-top: 30px;
        }
        .card {
            margin-bottom: 20px;
        }
        .refresh-btn {
            margin-bottom: 15px;
        }
        .stat-card {
            transition: transform 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="mb-4">API调用统计分析</h1>

    <button id="refreshBtn" class="btn btn-primary refresh-btn">
        <i class="bi bi-arrow-clockwise"></i> 刷新数据
    </button>

    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">调用次数分布</h5>
                    <canvas id="callDistributionChart"></canvas>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">最近调用时间</h5>
                    <canvas id="lastCallChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title">详细统计数据</h5>
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                    <tr>
                        <th>API名称</th>
                        <th>接口路径</th>
                        <th>调用次数</th>
                        <th>首次调用时间</th>
                        <th>最近调用时间</th>
                    </tr>
                    </thead>
                    <tbody id="statisticsTable">
                    <tr th:each="stat : ${statistics}">
                        <td th:text="${stat.apiName}">默认API名称</td>
                        <td th:text="${stat.apiPath}">默认接口路径</td>
                        <td th:text="${stat.callCount}">0</td>
                        <td th:text="${#dates.format(stat.firstCallTime, 'yyyy-MM-dd HH:mm:ss')}">
                            暂无时间
                        </td>
                        <td th:text="${#dates.format(stat.lastCallTime, 'yyyy-MM-dd HH:mm:ss')}">
                            暂无时间
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(statistics)}">
                        <td colspan="5" class="text-center text-muted">暂无API调用统计数据</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // 格式化时间（兼容JS动态获取数据的场景，保留并复用）
    function formatTime(timestamp) {
        if (!timestamp || timestamp === 0) return "暂无时间";
        const date = new Date(timestamp);
        // 格式化为 yyyy-MM-dd HH:mm:ss 格式
        return date.toLocaleString('zh-CN', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        }).replace(/\//g, '-'); // 兼容部分浏览器斜杠分隔，替换为横杠
    }

    // 加载统计数据（AJAX动态获取，与Thymeleaf服务端渲染互补）
    function loadStatisticsData() {
        $.get("/statistics/api/data", function(response) {
            if (response.code === 200 && response.data) {
                renderTable(response.data);
                renderCharts(response.data);
            }
        }).fail(function() {
            alert("加载统计数据失败");
        });
    }

    // 渲染表格（AJAX动态填充，与Thymeleaf服务端渲染互不冲突）
    function renderTable(statistics) {
        const tableBody = $("#statisticsTable");
        tableBody.empty();

        if (statistics.length === 0) {
            tableBody.append('<tr><td colspan="5" class="text-center text-muted">暂无API调用统计数据</td></tr>');
            return;
        }

        statistics.forEach(stat => {
            const row = `
                <tr>
                    <td>${stat.apiName || '未知API'}</td>
                    <td>${stat.apiPath || '未知路径'}</td>
                    <td>${stat.callCount || 0}</td>
                    <td>${formatTime(stat.firstCallTime)}</td>
                    <td>${formatTime(stat.lastCallTime)}</td>
                </tr>
            `;
            tableBody.append(row);
        });
    }

    // 渲染图表（核心修改：将时间戳转为可读时间）
    function renderCharts(statistics) {
        // 先判断数据是否为空，避免报错
        if (!statistics || statistics.length === 0) {
            return;
        }

        // 销毁原有图表，避免重复渲染
        const ctx1Dom = document.getElementById('callDistributionChart');
        const oldChart1 = Chart.getChart(ctx1Dom);
        if (oldChart1) {
            oldChart1.destroy();
        }
        // 调用次数分布图表（无需修改，保持原有逻辑）
        const ctx1 = ctx1Dom.getContext('2d');
        new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: statistics.map(stat => stat.apiName || '未知API'), // 接口名称作为标签
                datasets: [{
                    label: '调用次数',
                    data: statistics.map(stat => stat.callCount || 0),
                    backgroundColor: 'rgba(54, 162, 235, 0.5)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: true, ticks: { precision: 0 } }
                }
            }
        });

        // 销毁原有图表，避免重复渲染
        const ctx2Dom = document.getElementById('lastCallChart');
        const oldChart2 = Chart.getChart(ctx2Dom);
        if (oldChart2) {
            oldChart2.destroy();
        }
        // 最近调用时间图表（核心修改：时间戳转可读时间）
        const ctx2 = ctx2Dom.getContext('2d');
        new Chart(ctx2, {
            type: 'line',
            data: {
                labels: statistics.map(stat => stat.apiName || '未知API'), // 仍用接口名称作为X轴标签（清晰直观）
                datasets: [{
                    label: '最近调用时间', // 修改标签名称，去掉“时间戳”字样
                    // 关键：将时间戳转为格式化后的可读时间（作为数据展示）
                    // 注意：Chart.js 数值轴无法直接显示字符串，此处两种方案可选：
                    // 方案1（推荐）：保持数值轴，tooltip显示格式化时间（下方配置）
                    data: statistics.map(stat => stat.lastCallTime || 0),
                    fill: false,
                    borderColor: 'rgba(255, 99, 132, 1)',
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: false,
                        ticks: {
                            // 方案1：Y轴刻度仍显示时间戳，tooltip显示格式化时间（更稳定）
                            callback: function(value) {
                                return formatTime(value); // 关键：将Y轴刻度的时间戳转为可读时间
                            }
                        }
                    }
                },
                // 关键配置：tooltip悬浮时显示格式化时间（更友好）
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const timestamp = context.raw;
                                return `最近调用时间：${formatTime(timestamp)}`;
                            }
                        }
                    }
                }
            }
        });

        // 【可选方案2】：若需X轴显示时间（替换接口名称），可修改labels如下
        // labels: statistics.map(stat => formatTime(stat.lastCallTime)),
    }

    // 页面加载完成后初始化
    $(document).ready(function() {
        // 初始化时，先基于Thymeleaf服务端渲染的数据渲染图表
        const initStatistics = [];
        $("#statisticsTable tr").each(function(index, tr) {
            const $tds = $(this).find("td");
            if ($tds.length === 5) {
                const apiName = $tds.eq(0).text().trim();
                const apiPath = $tds.eq(1).text().trim();
                const callCountText = $tds.eq(2).text().trim();
                const firstCallTimeText = $tds.eq(3).text().trim();
                const lastCallTimeText = $tds.eq(4).text().trim();

                const callCount = isNaN(parseInt(callCountText)) ? 0 : parseInt(callCountText);
                let firstCallTime = 0;
                let lastCallTime = 0;
                try {
                    firstCallTime = firstCallTimeText !== "暂无时间" ? new Date(firstCallTimeText).getTime() : 0;
                    lastCallTime = lastCallTimeText !== "暂无时间" ? new Date(lastCallTimeText).getTime() : 0;
                } catch (e) {
                    console.warn("时间格式化失败：", e);
                }

                initStatistics.push({
                    apiName,
                    apiPath,
                    callCount,
                    firstCallTime,
                    lastCallTime
                });
            }
        });
        if (initStatistics.length > 0) {
            renderCharts(initStatistics);
        }

        // 刷新按钮事件
        $("#refreshBtn").click(function() {
            location.reload();
        });

        // 自动刷新（每30秒）
        setInterval(function() {
            location.reload();
        }, 30000);
    });
</script>
</body>
</html>
